<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shodiyor Mini App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #f7f0ff, #eef8ff);
            color: #27233a;
        }

        .app {
            max-width: 520px;
            margin: auto;
            padding: 18px;
        }

        .hero {
            padding: 24px;
            border-radius: 28px;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            box-shadow: 0 12px 28px #7c3aed33;
        }

        .hero h1 {
            margin: 7px 0;
        }

        .hero p {
            margin: 0;
            opacity: .9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .card {
            background: #fff;
            border: 0;
            border-radius: 22px;
            padding: 17px;
            text-align: left;
            min-height: 110px;
            box-shadow: 0 7px 20px #3331;
            font-size: 15px;
            cursor: pointer;
        }

        .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 8px;
        }

        .card b {
            display: block;
            margin-bottom: 4px;
        }

        .card span {
            color: #777;
            font-size: 13px;
        }

        .section {
            background: #fff;
            border-radius: 23px;
            padding: 18px;
            margin-top: 15px;
            box-shadow: 0 7px 20px #3331;
        }

        .section h2 {
            margin: 0 0 10px;
        }

        .task {
            display: block;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task input {
            width: 19px;
            height: 19px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 17px;
            background: #7c3aed;
            color: #fff;
            padding: 15px;
            margin-top: 14px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #toast {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: #29243b;
            color: white;
            padding: 14px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <main class="app">

        <section class="hero">
            <small>✨ MINI APP</small>
            <h1 id="welcome">Привет! 👋</h1>
            <p>Твоё маленькое красивое приложение 💜</p>
        </section>

        <section class="grid">

            <button class="card" onclick="toast('🎮 Игры скоро будут здесь!')">
                <i class="icon">🎮</i>
                <b>Игры</b>
                <span>Развлекайся</span>
            </button>

            <button class="card" onclick="toast('⭐ Ты сегодня молодец!')">
                <i class="icon">⭐</i>
                <b>Мотивация</b>
                <span>Немного вдохновения</span>
            </button>

            <button class="card" onclick="toast('📚 Раздел заданий открыт!')">
                <i class="icon">📚</i>
                <b>Задания</b>
                <span>Твои цели</span>
            </button>

            <button class="card" onclick="showProfile()">
                <i class="icon">👤</i>
                <b>Профиль</b>
                <span id="profileText">Загрузка...</span>
            </button>

        </section>

        <section class="section">

            <h2>🌸 План на сегодня</h2>

            <label class="task">
                <input type="checkbox">
                Сделать что-нибудь полезное
            </label>

            <label class="task">
                <input type="checkbox">
                Выучить что-нибудь новое
            </label>

            <label class="task">
                <input type="checkbox">
                Отдохнуть и улыбнуться 😊
            </label>

            <button class="btn" onclick="toast('🎉 Готово!')">
                Готово ✨
            </button>

        </section>

    </main>

    <div id="toast"></div>

    <script>

        // Telegram Mini App
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        // Получаем пользователя Telegram
        const user = tg.initDataUnsafe?.user;

        if (user) {

            document.getElementById("welcome").textContent =
                "Привет, " + user.first_name + "! 👋";

            document.getElementById("profileText").textContent =
                user.first_name +
                (user.last_name ? " " + user.last_name : "");

        } else {

            document.getElementById("profileText").textContent =
                "Открой через Telegram";

        }

        // Профиль
        function showProfile() {

            if (user) {

                let name = user.first_name;

                if (user.last_name) {
                    name += " " + user.last_name;
                }

                toast("👤 Ты вошёл как " + name);

            } else {

                toast("⚠️ Открой Mini App через Telegram");

            }
        }

        // Всплывающее сообщение
        function toast(x) {

            let t = document.getElementById("toast");

            t.textContent = x;
            t.style.display = "block";

            clearTimeout(window.toastTimer);

            window.toastTimer = setTimeout(() => {
                t.style.display = "none";
            }, 2000);

        }

    </script>

</body>

</html>
