<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто я? 🎭</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #6d4aff, transparent 45%),
        linear-gradient(135deg, #120c29, #28134d);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.logo {
    font-size: 70px;
}

h1 {
    font-size: 42px;
    margin: 5px 0 10px;
}

.subtitle {
    color: #d8ceff;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 17px;
    padding: 16px;
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    cursor: pointer;
}

button.secondary {
    background: rgba(255,255,255,0.12);
}

input {
    width: 100%;
    padding: 16px;
    border: none;
    outline: none;
    border-radius: 16px;
    margin-top: 8px;
    font-size: 17px;
    text-align: center;
}

.room-code {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 8px;
    padding: 25px;
    margin: 20px 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
}

.player {
    background: rgba(255,255,255,0.10);
    padding: 13px;
    margin-top: 8px;
    border-radius: 13px;
}

.character {
    font-size: 30px;
    font-weight: bold;
    padding: 35px 15px;
    margin: 25px 0;
    border-radius: 24px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
}

.message {
    min-height: 22px;
    margin-top: 15px;
    color: #ffd6f5;
}
</style>
</head>

<body>

<div class="game">

<div id="menu" class="screen active">

<div class="logo">🎭</div>

<h1>Кто я?</h1>

<p class="subtitle">
Игра для компании друзей
</p>

<button onclick="showScreen('create')">
👥 Создать игру
</button>

<button class="secondary" onclick="showScreen('join')">
🔑 Войти в игру
</button>

</div>


<div id="create" class="screen">

<h1>🏠 Создать комнату</h1>

<input
id="createName"
type="text"
placeholder="Например: Шодиёр"
>

<button onclick="createRoom()">
✨ Создать комнату
</button>

<button class="secondary"
onclick="showScreen('menu')">
← Назад
</button>

<div id="createMessage"
class="message">
</div>

</div>


<div id="room" class="screen">

<h1>👥 Комната</h1>

<p class="subtitle">
Отправь код друзьям
</p>

<div id="roomCode" class="room-code">
----
</div>

<div id="players">
</div>

<button onclick="startGame()">
🎮 Начать игру
</button>

<button class="secondary"
onclick="showScreen('menu')">
🚪 Выйти
</button>

</div>


<div id="join" class="screen">

<h1>🔑 Войти</h1>

<input
id="joinName"
type="text"
placeholder="Твоё имя"
>

<input
id="joinCode"
type="text"
placeholder="Код комнаты"
maxlength="4"
>

<button onclick="joinRoom()">
🚀 Войти
</button>

<button class="secondary"
onclick="showScreen('menu')">
← Назад
</button>

<div id="joinMessage"
class="message">
</div>

</div>


<div id="gameScreen" class="screen">

<div class="logo">🎭</div>

<h1>Кто я?</h1>

<p class="subtitle">
Твой персонаж:
</p>

<div id="character" class="character">
❓
</div>

<p>
Задавай вопросы другим игрокам,
чтобы угадать своего персонажа!
</p>

<button onclick="newCharacter()">
🎲 Новый персонаж
</button>

<button class="secondary"
onclick="showScreen('menu')">
🏠 В меню
</button>

</div>

</div>


<script>

let roomCode = "";

let players = [];


const characters = [
"🕷️ Человек-паук",
"🦇 Бэтмен",
"🧙 Гарри Поттер",
"🧜 Русалка",
"🏴‍☠️ Пират",
"🤖 Робот",
"🐼 Панда",
"🦁 Лев",
"🐱 Кот",
"🦄 Единорог",
"⚽ Футболист",
"🎤 Певец",
"👨‍🍳 Повар",
"👨‍🚀 Космонавт",
"🧛 Вампир",
"👑 Король",
"🧑‍🎨 Художник",
"🦸 Супергерой"
];


function showScreen(id) {

document
.querySelectorAll(".screen")
.forEach(function(screen) {

screen.classList.remove("active");

});

document
.getElementById(id)
.classList.add("active");

}


function createRoom() {

const name =
document
.getElementById("createName")
.value
.trim();

if (!name) {

document
.getElementById("createMessage")
.textContent =
"Напиши своё имя 😊";

return;

}


roomCode =
Math.random()
.toString(36)
.substring(2,6)
.toUpperCase();


players = [name];


document
.getElementById("roomCode")
.textContent =
roomCode;


updatePlayers();

showScreen("room");

}


function updatePlayers() {

const container =
document.getElementById("players");

container.innerHTML = "";

players.forEach(function(player,index) {

const div =
document.createElement("div");

div.className = "player";

div.textContent =
(index === 0 ? "👑 " : "👤 ")
+ player;

container.appendChild(div);

});

}


function joinRoom() {

const name =
document
.getElementById("joinName")
.value
.trim();

const code =
document
.getElementById("joinCode")
.value
.trim()
.toUpperCase();

if (!name || !code) {

document
.getElementById("joinMessage")
.textContent =
"Введи имя и код комнаты 😊";

return;

}


document
.getElementById("joinMessage")
.textContent =
"Комната найдена! 🎉";


players.push(name);

roomCode = code;

document
.getElementById("roomCode")
.textContent =
roomCode;

updatePlayers();

showScreen("room");

}


function startGame() {

newCharacter();

showScreen("gameScreen");

}


function newCharacter() {

const random =
Math.floor(
Math.random() *
characters.length
);

document
.getElementById("character")
.textContent =
characters[random];

}

</script>

</body>
</html>
